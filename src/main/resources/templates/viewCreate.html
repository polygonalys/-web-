<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作成画面</title>
    <link rel="stylesheet" th:href="@{../css/style.css}">
</head>
<body>
    <form th:action="@{/create}" method="post" th:object="${classesSchedules}">
            <table>
                <tr>
                    <th>学年を入力してください</th>
                    <td>
                        <input type="text" th:field="*{grade}"/>
                        <div th:errors="*{grade}"></div>
                    </td>
                </tr>
                <tr>
                    <th>時間割を入力して下さい</th>
                    <td>
                        <input type="text" th:field="*{hour}"/>
                        <div th:errors="*{hour}"></div>
                    </td>
                </tr>
                <tr>
                    <th>科目を入力して下さい</th>
                    <td>
                        <input type="text" th:field="*{schoolSubject}"/>
                        <div th:errors="*{schoolSubject}"></div>
                    </td>
                </tr>
            </table>
            <input type="submit" value="作成開始">
        </form>
</body>
</html>
