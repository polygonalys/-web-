<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索画面</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Hello,World</h1>
    <div class="menu-button">
        <form th:action="@{/read}" method="get" th:object="${classesSchedules}">
            <table>
                <tr>
                    <th>学年を入力してください</th>
                    <td>
                        <input type="text" th:field="*{grade}"/>
                        <div th:errors="*{grade}"></div>
                    </td>
                </tr>
                <tr>
                    <th>時間割を入力して下さい</th>
                    <td>
                        <input type="text" th:field="*{hour}"/>
                        <div th:errors="*{hour}"></div>
                    </td>
                </tr>
            </table>
            <input name="findById" type="submit" value="検索開始">
        </form>
        
        <form th:action="@{/read}" method="get">
            <input name="findAll" type="submit" value="全てのレコードを検索" >
        </form>
    </div>
</body>
</html>
