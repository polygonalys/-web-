<!DOCTYPE html>
<html lang="ja" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム</title>
    <link rel="stylesheet" th:href="@{../css/style.css}">
</head>
<body>
    <div th:if="${param.error}">
                <div class="alert alert-danger">
                    <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION.message ?: 'ユーザー情報が見つかりません'}"></span>
                </div>
            </div>
    <form th:action="@{/login}" autocomplete="off" method="post">
        <table>
            <tr>
                <td><label>ユーザーID</label></td>
                <td><input type="text" name="userId" required></td>
            </tr>
            <tr>
                <td><label>パスワード</label></td>
                <td><input type="password" name="userPassword" required></td>
            </tr>
            <tr>
                <td><button type="submit">ログイン</button></td>
            </tr>
        </table>
    </form>
        <a th:href="@{/signup}">新規登録</a>
</body>
</html>
